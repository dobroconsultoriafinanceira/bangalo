# Bangalô — produção na VPS (Hostinger, root@<ip>:/root/bangalo)
#
# A VPS já roda o stack do Dobro (/root/dobro), cujo Caddy é dono das portas
# 80/443 e serve o site institucional e o dashboard. O Bangalô NÃO sobe Caddy
# próprio: o container `bangalo_web` entra na rede do Caddy do Dobro
# (`dobro_frontend`, externa aqui) e recebe o tráfego por reverse proxy.
# Confira o nome real da rede com `docker network ls` — o Compose nomeia como
# <pasta-do-projeto>_frontend.
#
# Deploy do dia a dia: `git pull` (o hook post-merge rebuilda) ou `make deploy`.
# Cenário alternativo (VPS sem Caddy): `docker compose --profile com-caddy up -d`

services:
  web:
    build: .
    container_name: bangalo_web
    restart: unless-stopped
    env_file: .env
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # VPS KVM1 (1 vCPU) — 2 workers. Suba se a VPS crescer.
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
    volumes:
      # certificado/chave do Itaú (gerados por `flask itau-certificado`, fora do git)
      - ./instance/itau:/srv/bangalo/instance/itau
      # documentos do fechamento e PDFs exportados (fora do git, precisam de backup)
      - ./instance/arquivos:/srv/bangalo/instance/arquivos
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - bangalo_interna
      - dobro_frontend  # rede do Caddy do stack do Dobro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 768M

  db:
    image: postgres:16-alpine
    container_name: bangalo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Sao_Paulo
    volumes:
      - bangalo_pgdata:/var/lib/postgresql/data
    networks:
      - bangalo_interna
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M

  # Cenário alternativo apenas — Caddy próprio (conflita com o Caddy do Dobro em 80/443)
  caddy:
    image: caddy:2-alpine
    container_name: bangalo_caddy
    profiles: ["com-caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - bangalo_caddy_data:/data
      - bangalo_caddy_config:/config
    networks:
      - bangalo_interna

volumes:
  bangalo_pgdata:
  bangalo_caddy_data:
  bangalo_caddy_config:

networks:
  bangalo_interna:
  dobro_frontend:
    external: true
    name: dobro_frontend
