{% extends "auth/_layout.html" %}
{% block titulo %}Nova senha{% endblock %}
{% block conteudo %}
<form method="post" class="surface" data-busy="Salvando…">
  {{ ui.csrf() }}
  <h1>Definir nova senha</h1>
  <p class="auth-subtitle">Use pelo menos 10 caracteres, com letras e números ou símbolos. O link vale uma única vez.</p>
  <div class="field">
    <label for="senha">Nova senha <span class="required" aria-hidden="true">*</span></label>
    <div class="password-wrap">
      <input id="senha" name="senha" type="password" required minlength="10" maxlength="200" autocomplete="new-password" autofocus>
      <button type="button" class="btn ghost small" data-toggle-senha="senha" aria-controls="senha" aria-pressed="false">Mostrar</button>
    </div>
  </div>
  <div class="field">
    <label for="confirmar">Confirmar nova senha <span class="required" aria-hidden="true">*</span></label>
    <input id="confirmar" name="confirmar" type="password" required minlength="10" maxlength="200" autocomplete="new-password">
  </div>
  <button type="submit" class="btn primary">Salvar senha</button>
  <p class="auth-footer mb-0"><a href="{{ url_for('auth.login') }}">Voltar para entrar</a></p>
</form>
{% endblock %}
