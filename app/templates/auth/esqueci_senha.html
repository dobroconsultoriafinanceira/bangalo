{% extends "auth/_layout.html" %}
{% block titulo %}Recuperar senha{% endblock %}
{% block conteudo %}
<form method="post" class="surface" data-busy="Enviando…">
  {{ ui.csrf() }}
  <h1>Recuperar senha</h1>
  <p class="auth-subtitle">Informe seu e-mail para solicitar um novo link de acesso.</p>
  <div class="field">
    <label for="email">E-mail <span class="required" aria-hidden="true">*</span></label>
    <input id="email" name="email" type="email" required autofocus autocomplete="username">
  </div>
  <button type="submit" class="btn primary">Enviar link</button>
  <p class="auth-footer mb-0"><a href="{{ url_for('auth.login') }}">Voltar para entrar</a></p>
</form>
{% endblock %}
