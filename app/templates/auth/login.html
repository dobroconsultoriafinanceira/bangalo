{% extends "auth/_layout.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<form method="post" class="surface" data-busy="Entrando…">
  {{ ui.csrf() }}
  <h1>Entre na sua conta</h1>
  <p class="auth-subtitle">Acesse o financeiro do seu restaurante.</p>
  <div class="field">
    <label for="email">E-mail <span class="required" aria-hidden="true">*</span></label>
    <input id="email" name="email" type="email" required autofocus autocomplete="username" value="{{ request.form.get('email', '') }}">
  </div>
  <div class="field">
    <label for="senha">Senha <span class="required" aria-hidden="true">*</span></label>
    <div class="password-wrap">
      <input id="senha" name="senha" type="password" required autocomplete="current-password">
      <button type="button" class="btn ghost small" data-toggle-senha="senha" aria-controls="senha" aria-pressed="false">Mostrar</button>
    </div>
  </div>
  <button type="submit" class="btn primary">Entrar</button>
  <p class="auth-footer mb-0"><a href="{{ url_for('auth.esqueci_senha') }}">Esqueci minha senha</a></p>
</form>
{% endblock %}
